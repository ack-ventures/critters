services:
  critters:
    build: .
    # or: image: ghcr.io/ack-ventures/critters:latest
    env_file: .env
    volumes:
      - ~/.critters:/root/.critters       # config, metrics, state
      - ~/.ssh:/root/.ssh:ro              # SSH keys for git clone
      - ~/.config/gh:/root/.config/gh:ro  # GitHub CLI auth
      - ~/.claude:/root/.claude             # Claude CLI auth
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    ports:
      - "3847:3847"
    restart: unless-stopped
