services:
  critters:
    build:
      context: .
      # target: prod  # use released binary instead of building from source
    # or: image: ghcr.io/ack-ventures/critters:latest
    env_file: .env
    # environment:
    #   CRITTERS_SETUP_SCRIPT: /root/.critters/setup.sh  # default; override to use a different path
    volumes:
      - ~/.critters:/root/.critters       # config, metrics, state (+ optional setup.sh)
      - ~/.ssh:/root/.ssh:ro              # SSH keys for git clone
      - ~/.claude:/root/.claude             # Claude CLI data
      - ~/.claude.json:/root/.claude.json    # Claude CLI auth config
    ports:
      - "3847:3847"
    restart: unless-stopped
