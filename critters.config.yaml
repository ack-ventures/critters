provider: linear
# provider: jira
# provider: [linear, jira]
cli: claude

pollIntervalSeconds: 120
workDir: /tmp/critters-work
tmuxSession: critters
healthPort: 3847
# maxLogSizeMb: 10          # Max log file size before rotation (with --no-tmux)

defaultAllowedTools:
  - "Read"
  - "Write"
  - "Edit"
  - "Glob"
  - "Grep"
  - "Bash(git:*)"
  - "Bash(gh:*)"
  - "Bash(bun:*)"
  - "Bash(npm:*)"
  - "Bash(npx:*)"
  - "Bash(node:*)"
  - "Bash(tsc:*)"
  - "Bash(ls:*)"
  - "Bash(mkdir:*)"
  - "Bash(cat:*)"

repos:
  # Linear project ID or Jira project key → repo config
  # "project-uuid-1":
  #   url: "git@github.com:your-org/your-repo.git"
  #   extraAllowedTools: ["Bash(poetry:*)"]

teamRepos:
  # Fallback: Linear team ID → repo URL
  # "team-uuid-1": "git@github.com:your-org/default-repo.git"

# Jira status mapping (required when using provider: jira)
# jiraStatusMap:
#   "Todo": "To Do"
#   "In Progress": "In Progress"
#   "In Review": "In Review"
#   "Done": "Done"
#   "Critter Failed": "Failed"
#   "Human Review": "Needs Review"

critterTypes:
  create:
    trigger: { label: "Critter", status: "Todo", statusType: "unstarted" }
    # trigger.assignee: "alice@company.com"  # optional: only pick up issues assigned to this user
    repo: { clone: true, branch: true }
    concurrency: 1
    timeoutMinutes: 30
    phases:
      - name: planning
        prompt: builtin:planning
        cli: claude
        model: opus
        maxTurns: 50
        tools: readonly
      - name: execution
        prompt: builtin:execution
        cli: claude
        model: opus
        maxTurns: 75
        tools: default
    outcomes:
      success: { status: "In Review", removeLabel: true }
      failure: { status: "Critter Failed" }

  review:
    trigger: { label: "Critter Review", status: "In Review" }
    repo: { clone: true }
    concurrency: 1
    timeoutMinutes: 15
    enrichment: extractPrUrl
    phases:
      - name: review
        prompt: builtin:review
        cli: codex
        model: gpt-5.4
        maxTurns: 30
        tools: review
        sandbox: danger-full-access
    outcomes:
      merged: { status: "Done" }
      needsChanges: { status: "Todo" }
      failure: { status: "Critter Failed" }

  fix-review-comments:
    trigger: { label: "Critter Review", status: "Todo", statusType: "unstarted" }
    repo: { clone: true, branch: true }
    concurrency: 1
    timeoutMinutes: 30
    enrichment: extractPrUrl
    phases:
      - name: fix-review-comments
        prompt: ./prompts/fix-review-comments.md
        cli: codex
        model: gpt-5.4
        maxTurns: 50
        tools: default
        sandbox: danger-full-access
    outcomes:
      success: { status: "In Review" }
      failure: { status: "Critter Failed" }

# Shell hooks — commands run on lifecycle events
# Environment variables available: CRITTER_ISSUE_ID, CRITTER_IDENTIFIER,
# CRITTER_TITLE, CRITTER_REPO_URL, CRITTER_BRANCH, CRITTER_PR_URL (when applicable)
