pollIntervalSeconds: 120
concurrency: 5
timeoutMinutes: 30
workDir: /tmp/critters-work
triggerLabel: "Critter"
maxPlanningTurns: 50
maxExecutionTurns: 75
tmuxSession: critters
# Health check HTTP server port (0 to disable, must be 1024-65535)
healthPort: 3847
# planningModel: opus
# executionModel: opus

# Review critter settings
# reviewTriggerLabel: "Critter Review"
# reviewModel: opus
# reviewConcurrency: 2
# reviewTimeoutMinutes: 15
# maxReviewTurns: 30

defaultAllowedTools:
  - "Read"
  - "Write"
  - "Edit"
  - "Glob"
  - "Grep"
  - "Bash(git:*)"
  - "Bash(gh:*)"
  - "Bash(bun:*)"
  - "Bash(npm:*)"
  - "Bash(npx:*)"
  - "Bash(node:*)"
  - "Bash(tsc:*)"
  - "Bash(ls:*)"
  - "Bash(mkdir:*)"
  - "Bash(cat:*)"

repos:
  # Linear project ID → repo config
  # "project-uuid-1":
  #   url: "git@github.com:your-org/your-repo.git"
  #   extraAllowedTools: ["Bash(poetry:*)"]

teamRepos:
  # Fallback: Linear team ID → repo URL
  # "team-uuid-1": "git@github.com:your-org/default-repo.git"

